<style>
/* Layout: one calm column of focus (Big 3, something for you) beside a quiet side rail (load, balance, avoidance). Coach and planning live in their own tabs. */
:root {
  --bg: #F1F3F8; --surface: #FFFFFF; --surface-2: #E7EAF2; --ink: #151B2D; --ink-2: #44506B; --ink-3: #5B6783;
  --line: #D5DAE6; --accent: #2D45D1; --accent-ink: #FFFFFF; --accent-soft: #E0E5FB;
  --good: #1D7443; --good-bg: #DDF0E5; --warn: #8F5A00; --warn-bg: #F7E8C8; --crit: #A93528; --crit-bg: #F6DAD5;
  --c-work: #4A5A7A; --c-practice: #0F8A8A; --c-content: #7B4FD0; --c-people: #D1456B; --c-joy: #D98E00; --c-self: #2E9E5B; --c-space: #3E8FD0;
  --font-display: "Schibsted Grotesk", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1320; --surface: #171C2E; --surface-2: #21283D; --ink: #E8ECF7; --ink-2: #B5BED6; --ink-3: #8D98B5;
    --line: #2B3350; --accent: #8195FF; --accent-ink: #0B1030; --accent-soft: #232C5A;
    --good: #66D194; --good-bg: #173425; --warn: #E3AE55; --warn-bg: #3A2F15; --crit: #F28B7F; --crit-bg: #3B1E1A;
    --c-work: #9AA9C9; --c-practice: #4FC9C9; --c-content: #B193F5; --c-people: #F07C9C; --c-joy: #FFC13D; --c-self: #5FD08D; --c-space: #6DB6F0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1320; --surface: #171C2E; --surface-2: #21283D; --ink: #E8ECF7; --ink-2: #B5BED6; --ink-3: #8D98B5;
  --line: #2B3350; --accent: #8195FF; --accent-ink: #0B1030; --accent-soft: #232C5A;
  --good: #66D194; --good-bg: #173425; --warn: #E3AE55; --warn-bg: #3A2F15; --crit: #F28B7F; --crit-bg: #3B1E1A;
  --c-work: #9AA9C9; --c-practice: #4FC9C9; --c-content: #B193F5; --c-people: #F07C9C; --c-joy: #FFC13D; --c-self: #5FD08D; --c-space: #6DB6F0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 40; }
.wrap { max-width: 1100px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.15; text-wrap: balance; }
h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
h3 { font-size: 15px; font-weight: 800; }
p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.eyebrow { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
[hidden] { display: none !important; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 12px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.brandrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 22px; font-weight: 800; }
.brand .date { color: var(--ink-3); font-size: 13px; }
.capture { display: flex; gap: 6px; flex: 1 1 320px; max-width: 520px; }
.capture input[type=text] { flex: 1 1 auto; min-width: 0; }
.tabs { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px 9px; cursor: pointer; font-weight: 600; color: var(--ink-2); white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.count { font-family: var(--font-data); font-size: 11px; background: var(--surface-2); border-radius: 99px; padding: 1px 7px; color: var(--ink-2); }
main { padding-top: 20px; }

input[type=text], input[type=date], input[type=number], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-height: 36px; width: 100%; }
textarea { resize: vertical; min-height: 64px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600; min-height: 34px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { border-color: var(--line); }
.btn.small { padding: 2px 9px; min-height: 28px; font-size: 12px; }
.btn.danger { color: var(--crit); }
.btn[disabled] { opacity: .5; cursor: default; }
.ico { width: 15px; height: 15px; flex: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.crit { background: var(--crit-bg); color: var(--crit); }
.pill.good { background: var(--good-bg); color: var(--good); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.pill.area { background: color-mix(in srgb, var(--c) 16%, var(--surface)); color: var(--ink); }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; align-items: start; }
@media (max-width: 880px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.stack { display: grid; gap: 20px; min-width: 0; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
.sec-head p { color: var(--ink-3); font-size: 13px; }
.hello { display: grid; gap: 6px; }
.hello h2 { font-size: 26px; }
.intent { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.intent input { flex: 1 1 260px; border-style: dashed; }

.big3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.slot { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 12px; padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.slot.empty { border-style: dashed; border-top-width: 1px; background: none; color: var(--ink-3); align-content: center; min-height: 130px; text-align: center; }
.slot .t { font-family: var(--font-display); font-weight: 800; font-size: 17px; line-height: 1.2; overflow-wrap: anywhere; cursor: pointer; }
.slot .why { font-size: 13px; color: var(--ink-2); font-style: italic; }
.slot.done .t { text-decoration: line-through; color: var(--ink-3); }
.row-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.joy { border-color: color-mix(in srgb, var(--c-joy) 55%, var(--line)); background: color-mix(in srgb, var(--c-joy) 9%, var(--surface)); }
.joy.missing h3 { color: var(--warn); }

.list { display: grid; gap: 0; }
.trow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.trow:first-child { border-top: 0; }
.trow .tt { cursor: pointer; overflow-wrap: anywhere; font-weight: 500; }
.trow.done .tt { text-decoration: line-through; color: var(--ink-3); }
.chk { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--ink-3); background: none; cursor: pointer; padding: 0; display: grid; place-items: center; color: transparent; }
.chk:hover { border-color: var(--good); color: var(--good); }
.chk.on { background: var(--good); border-color: var(--good); color: #fff; }
.trow .acts { display: flex; gap: 4px; }

.meter { height: 12px; border-radius: 99px; background: var(--surface-2); position: relative; overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
.meter .m-done { background: var(--c, var(--good)); }
.meter .m-plan { background: color-mix(in srgb, var(--c, var(--accent)) 35%, var(--surface-2)); }
.bal { display: grid; gap: 12px; }
.bal-row { display: grid; gap: 4px; }
.bal-row .top-line { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; align-items: center; }
.alert { padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 13px; display: grid; gap: 8px; }
.alert.crit { background: var(--crit-bg); color: var(--crit); }
.alert strong { font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.goal { display: grid; gap: 10px; border-left: 5px solid var(--c); }
.goal .gt { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: start; }
.gh { font-family: var(--font-display); font-weight: 800; font-size: 18px; overflow-wrap: anywhere; }
.next { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 14px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.prop { display: grid; gap: 4px; }
.prop label { display: flex; gap: 8px; align-items: start; padding: 4px 0; }

.chat { display: grid; grid-template-rows: auto minmax(320px, 58vh) auto; gap: 12px; }
.log { overflow-y: auto; display: grid; gap: 10px; align-content: start; padding: 4px 2px; }
.msg { max-width: 82ch; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { background: var(--accent); color: var(--accent-ink); justify-self: end; border-bottom-right-radius: 3px; }
.msg.assistant { background: var(--surface); border: 1px solid var(--line); justify-self: start; border-bottom-left-radius: 3px; }
.acts-log { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.compose { display: flex; gap: 8px; align-items: end; }
.compose textarea { min-height: 44px; max-height: 160px; }

.overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 55%, transparent); z-index: 60; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.sheet { background: var(--surface); border-radius: 14px; border: 1px solid var(--line); width: min(100%, 520px); padding: 20px; display: grid; gap: 12px; max-height: 100%; overflow-y: auto; }
.sheet.wide { width: min(100%, 620px); }
.field { display: grid; gap: 4px; }
.field > label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 440px) { .two { grid-template-columns: 1fr; } }
.focus { text-align: center; justify-items: center; gap: 16px; padding: 28px 20px; }
.focus .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 5vw, 32px); text-wrap: balance; overflow-wrap: anywhere; }
.timer { font-family: var(--font-data); font-size: 56px; font-weight: 500; font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-size: 14px; z-index: 80; max-width: calc(100vw - 32px); }
.empty-note { color: var(--ink-3); font-size: 14px; padding: 6px 0; }
@media (prefers-reduced-motion: no-preference) { .slot, .btn { transition: border-color .15s, background .15s; } }
.card.brief { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
.card.dump.doneit { background: var(--surface); }
.timer.small { font-size: 28px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
.legend .lg { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
.lg.cal { background: var(--ink-3); } .lg.tk { background: var(--accent); } .lg.lim { background: var(--crit); height: 2px; }
.hz { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.hzc { display: grid; gap: 4px; justify-items: center; padding: 4px 0; border-radius: 8px; }
.hzc.today { background: var(--accent-soft); }
.hzbar { width: 100%; max-width: 44px; height: 72px; display: flex; flex-direction: column-reverse; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.hzbar.over { outline: 2px solid var(--crit); }
.hzbar i { display: block; width: 100%; }
.b-cal { background: var(--ink-3); } .b-tk { background: var(--accent); }
.hzl { font-family: var(--font-data); font-size: 11px; color: var(--ink-3); }
</style>

<div class="wrap">
  <header class="top">
    <div class="brandrow">
      <div class="brand"><h1>Daily Compass</h1><span class="date" id="dateline"></span></div>
      <form class="capture" id="capform" autocomplete="off">
        <input type="text" id="cap" placeholder="Capture anything. Enter to drop it in the inbox" aria-label="Capture a task">
        <select id="capArea" aria-label="Area" style="width:auto"></select>
        <button class="btn primary" type="submit">Add</button>
      </form>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>
<div id="layer"></div>
<div class="toast" id="toast" hidden></div>

<script>
const AREAS = [
  { id: "build", name: "Practice building", cv: "--c-work" },
  { id: "clients", name: "Client work", cv: "--c-practice" },
  { id: "content", name: "Content", cv: "--c-content" },
  { id: "people", name: "People", cv: "--c-people" },
  { id: "joy", name: "Joy", cv: "--c-joy" },
  { id: "self", name: "Body & mind", cv: "--c-self" },
  { id: "space", name: "Space", cv: "--c-space" }
];
const AREA = Object.fromEntries(AREAS.map(a => [a.id, a]));
AREA.work = AREA.build; AREA.practice = AREA.clients;
const NOURISH = ["joy", "people", "self", "space"];
const AREA_HELP = "build = building the practice (admin, marketing, website, courses, products, longer projects); clients = client work (session prep, notes review, continuing education, EFT supervision); content = YouTube/TikTok/writing; people = friends, partner, family; joy = fun and play; self = body and mind (exercise, mindfulness); space = creativity, silence, slowing down";
const DEFAULTS = { capacity: 390, targets: { joy: 240, people: 240, self: 180, space: 180 }, values: ["Joy", "Gratitude", "Bravery", "Presence", "Relationships"], profile: "", calendars: [] };

const S = { tasks: {}, goals: {}, plans: {}, days: {}, habits: {}, settings: { ...DEFAULTS }, coach: [] };
let tab = "today", filter = "all", DB = null, SAMPLE = null, MCP = null, busy = false, pendingRender = false, draft = "", ctl = null, focusTimer = null, booted = {}, briefBusy = false, REV = null, gateReason = "";
const CAL = { events: [], status: "idle", at: 0 };
const proposals = {};

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const weekStart = (s) => { const d = new Date((s || todayISO()) + "T12:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const dayName = s => new Date(s + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
const rid = () => Math.random().toString(36).slice(2, 8);
const fmtM = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
const clean = o => JSON.parse(JSON.stringify(o));

const IC = {
  check: '<path d="M4 12l5 5L20 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  starOn: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  next: '<path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
  play: '<path d="M7 4l13 8-13 8z" fill="currentColor"/>',
  plus: '<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
  gear: '<circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
};
const ico = (n, c) => `<svg class="ico ${c || ""}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- storage: shared db when available, localStorage otherwise ---------- */
const LS = "daily-compass-v1";
function lsSave() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
function lsLoad() { try { const j = JSON.parse(localStorage.getItem(LS) || "null"); if (j) Object.assign(S, j); S.settings = { ...DEFAULTS, ...(S.settings || {}) }; } catch (e) {} }
const store = {
  set(coll, id, data) {
    data = clean(data);
    if (coll === "settings") S.settings = { ...DEFAULTS, ...data }; else S[coll][id] = data;
    schedule();
    if (DB) DB.doc(`${coll}/${id}`).set(data).catch(() => toast("Could not save. Check your connection."));
    else lsSave();
  },
  patch(coll, id, p) { store.set(coll, id, { ...S[coll][id], ...p }); },
  del(coll, id) {
    delete S[coll][id]; schedule();
    if (DB) DB.doc(`${coll}/${id}`).delete().catch(() => {}); else lsSave();
  }
};
async function boot() {
  render();
  lsLoad();
  DB = (window.claude && window.claude.use) ? await window.claude.use("db").catch(() => null) : null;
  if (!DB) { render(); syncCal(); return; }
  for (const coll of ["tasks", "goals", "plans", "days", "habits"]) {
    DB.collection(coll).onSnapshot(snap => { S[coll] = {}; snap.docs.forEach(d => { S[coll][d.id] = d.data(); }); booted[coll] = 1; schedule(); }, () => {});
  }
  DB.doc("settings/main").onSnapshot(s => { S.settings = { ...DEFAULTS, ...(s.exists ? s.data() : {}) }; booted.settings = 1; schedule(); }, () => {});
  DB.doc("coach/log").onSnapshot(s => { if (!busy) { S.coach = (s.exists && s.data().messages) || []; if (tab === "coach") paintLog(); } }, () => {});
  syncCal();
}

/* ---------- calendar and email through the viewer's connectors ---------- */
async function mcp() {
  if (MCP) return MCP;
  MCP = (window.claude && window.claude.use) ? await window.claude.use("mcp").catch(() => null) : null;
  return MCP;
}
function unwrap(r) {
  if (!r) return null;
  if (r.payload) return r.payload;
  if (r.structuredContent) return r.structuredContent;
  try { const c = (r.content || []).find(x => x.type === "text"); return c ? JSON.parse(c.text) : null; } catch (e) { return null; }
}
const fmtT = s => new Date(s).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

    ${CAL.status === "ok" ? `<p class="muted" style="font-size:13px;margin-top:8px">${fmtM(booked)} booked${win ? ` · longest open window ${fmtM(win.mins)} (${win.label})` : " · no open window of 30 min or more left"}</p>` : ""}
    <div class="row-actions" style="margin-top:8px"><button class="btn small" data-act="syncCal">${CAL.status === "ok" ? "Refresh" : "Sync calendar"}</button></div></section>`;
  const habits = Object.entries(S.habits).map(([id, hb]) => { const n = (day.h || {})[id] || 0, pct = Math.min(100, (n / (hb.target || 1)) * 100); return `<div class="bal-row" style="--c:var(${(AREA[hb.area] || AREA.self).cv})"><div class="top-line"><span>${esc(hb.title)}</span><span class="mono muted">${n}/${hb.target} ${esc(hb.unit || "")}</span></div><div class="row-actions" style="flex-wrap:nowrap;align-items:center"><div class="meter" style="flex:1"><i class="m-done" style="width:${pct}%"></i></div><button class="btn small" data-act="habit" data-id="${id}" data-n="${hb.step || 1}" aria-label="Add ${hb.step || 1} ${esc(hb.unit || "")} to ${esc(hb.title)}">+${hb.step || 1}</button></div></div>`; }).join("");
  const streak = dumpStreak();
  const brief = day.brief;
  return `<div class="cols"><div class="stack">
    <section class="card brief"><div class="sec-head"><h3>Daily brief</h3>${brief ? `<span class="muted" style="font-size:12px">${new Date(brief.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</span>` : ""}</div>
      ${brief ? `<p style="white-space:pre-wrap">${esc(brief.text)}</p>` : `<p class="muted">Calendar, tasks, balance and avoidance, boiled down to what today needs.</p>`}
      <div class="row-actions" style="margin-top:10px"><button class="btn ${brief ? "" : "primary"} small" data-act="brief" ${briefBusy ? "disabled" : ""}>${briefBusy ? "Writing…" : brief ? "Refresh brief" : "Get my brief"}</button><button class="btn small" data-act="ask" data-q="Plan my day. Look at everything on my plate and my calendar, challenge it against my values, and help me land a Big 3 plus one thing for me. Ask me one sharp question first." data-label="Plan my day">Plan with coach</button></div></section>
    <section class="hello"><p class="eyebrow">${dayName(T)}</p><h2>${greet}, Wes. What matters most today?</h2>
      <div class="intent"><span class="eyebrow">This week</span><input type="text" id="weekIntent" value="${esc(plan ? plan.text : "")}" placeholder="Set one intention for the week" data-save="week" aria-label="Week intention"></div>
      ${mon ? `<p class="muted" style="font-size:13px"><strong>This month:</strong> ${esc(mon.text)}</p>` : ""}</section>
    <section class="card dump ${day.dumped ? "doneit" : ""}"><div class="sec-head"><h3>${day.dumped ? "Mind downloaded today" : "Download your mind"}</h3><span class="pill ${streak ? "good" : ""}">${streak ? streak + "-day streak" : "no streak yet"}</span></div>
      <p class="muted" style="font-size:14px">${day.dumped ? "Nice. Anything new since then?" : "Five minutes. Get it all out of your head and let the coach sort it."}</p>
      <div class="row-actions" style="margin-top:10px"><button class="btn ${day.dumped ? "" : "primary"} small" data-act="dump" data-mode="daily">${day.dumped ? "Dump more" : "Start 5-minute dump"}</button><button class="btn small" data-act="dump" data-mode="import">Import notes</button><button class="btn small" data-act="scanMail">Scan email for tasks</button><button class="btn small" data-act="ask" data-q="Let's work the backlog. Look at my inbox and unscheduled tasks, tell me what to drop, what to schedule this week, and what is really a goal in disguise. One question first." data-label="Work the backlog">Work the backlog</button></div></section>
    <section><div class="sec-head"><h2>Big 3</h2><p>Three at most. Everything else is a bonus.</p></div><div class="big3">${slots}</div></section>
    <section>${joyBlock}</section>
    <section class="card"><div class="sec-head"><h3>Also today</h3><p>${rest.length} open</p></div>${rest.length ? `<div class="list">${rest.map(t => row(t)).join("")}</div>` : `<p class="empty-note">Nothing else scheduled. Pull something from below if you have room.</p>`}</section>
    <section class="card"><div class="sec-head"><h3>Pull in next</h3><p>Ranked by due date, goals, things you keep moving, and what your week is missing.</p></div>${pull.length ? `<div class="list">${pull.map(t => row(t, { today: true, tmrw: true })).join("")}</div>` : `<p class="empty-note">The inbox is empty. Capture something above.</p>`}</section>
    <section class="card"><div class="sec-head"><h3>Close the day</h3><p>Two lines. Presence and gratitude, on purpose.</p></div>
      <div class="field"><label for="win">One thing that went well</label><input type="text" id="win" data-save="day" data-f="win" value="${esc(day.win || "")}"></div>
      <div class="field" style="margin-top:8px"><label for="grat">One thing I'm grateful for</label><input type="text" id="grat" data-save="day" data-f="grat" value="${esc(day.grat || "")}"></div>
      <div class="row-actions" style="margin-top:10px"><button class="btn small" data-act="ask" data-q="Close my day with me. Ask me how it went against my Big 3, what I avoided, and what I want tomorrow to protect." data-label="Close my day">Shut down with coach</button></div></section>
  </div><aside class="stack">
    ${calCard}
    <section class="card"><div class="sec-head"><h3>Today's load</h3><span class="mono muted">${fmtM(total)} of ${fmtM(cap)}</span></div>
      <div class="meter" style="--c:var(--accent)"><i class="m-done" style="width:${Math.min(100, (L.done / Math.max(cap, total)) * 100)}%"></i><i class="m-plan" style="width:${Math.min(100, (L.plan / Math.max(cap, total)) * 100)}%"></i></div>
      <p class="muted" style="font-size:12px;margin-top:6px">Tasks only. Calendar time is counted separately.</p>

      ${packed && !over ? `<div class="alert" style="margin-top:12px"><span><strong>${fmtM(total + booked)} booked plus planned.</strong> There is no space in this day. Where does the silence go?</span><div class="row-actions"><button class="btn small" data-act="ask" data-q="Today is packed from calendar plus tasks. Help me protect real space in it, and tell me what I'm afraid will happen if I leave room.">Protect space</button></div></div>` : ""}</section>
    ${habits ? `<section class="card"><div class="sec-head"><h3>Daily goals</h3><button class="btn small ghost" data-act="habits">Manage</button></div><div class="bal">${habits}</div></section>` : `<section class="card"><div class="sec-head"><h3>Daily goals</h3></div><p class="empty-note">Micro-workouts and small daily targets, like 300 push-ups in sets of 50. They count toward your weekly body time.</p><button class="btn small" data-act="habits">Add a daily goal</button></section>`}
    <section class="card"><div class="sec-head"><h3>Week balance</h3><p>Done + planned vs target</p></div><div class="bal">${bal}</div></section>
    <section class="card"><div class="sec-head"><h3>Avoidance radar</h3></div>${avoid.length ? `<div class="stack" style="gap:10px">${avoid.slice(0, 4).map(t => `<div class="alert"><span><strong>${esc(t.title)}</strong><br>${t.deferCount ? `Moved ${t.deferCount}×.` : ""} ${t.hard ? "Hard conversation." : ""}</span><div class="row-actions"><button class="btn small" data-act="focus" data-id="${t.id}">Just 10 minutes</button><button class="btn small" data-act="askTask" data-id="${t.id}">Ask coach</button><button class="btn small ghost" data-act="someday" data-id="${t.id}">Drop it</button></div></div>`).join("")}</div>` : `<p class="empty-note">Nothing is being dodged right now.</p>`}</section>
  </aside></div>`;
}

function viewHorizon() {
  const T = todayISO(), cap = S.settings.capacity, dueNoDay = open().filter(t => t.due && !t.day).sort((a, b) => a.due.localeCompare(b.due));
  const weeks = [];
  for (let w = 0; w < 8; w++) {
    const ws = addDays(weekStart(T), w * 7), days = [...Array(7)].map((_, i) => addDays(ws, i));
    const info = days.map(d => ({ d, cal: calBusy(d), task: open().filter(t => t.day === d).reduce((s, t) => s + est(t), 0) }));
    const dues = open().filter(t => t.due && t.due >= ws && t.due <= days[6]).sort((a, b) => a.due.localeCompare(b.due));
    const gs = Object.values(S.goals).filter(g => g.target && g.target >= ws && g.target <= days[6]);
    const allday = [...new Set(days.flatMap(d => eventsOn(d).filter(e => e.allDay && !/birthday/i.test(e.title)).map(e => e.title)))];
    weeks.push({ ws, info, dues, gs, allday });
  }
  const mx = Math.max(660, ...weeks.flatMap(w => w.info.map(i => i.cal + i.task)));
  return `<div class="stack"><div class="sec-head"><div><h2>Horizon</h2><p>The next eight weeks: calendar, scheduled tasks, deadlines, goal dates.</p></div><div class="row-actions"><span class="muted" style="font-size:12px">${calStatusLine()}</span><button class="btn small" data-act="syncCal">Sync</button></div></div>
  ${dueNoDay.length ? `<section class="card"><div class="sec-head"><h3>Due, but not scheduled</h3><p>These have a deadline and no day.</p></div><div class="list">${dueNoDay.slice(0, 8).map(t => row(t, { today: true, tmrw: true })).join("")}</div></section>` : ""}
  <div class="legend"><span><i class="lg cal"></i>Calendar</span><span><i class="lg tk"></i>Tasks</span><span><i class="lg lim"></i>11h line</span></div>
  ${weeks.map((w, i) => `<section class="card"><div class="sec-head"><h3>${i === 0 ? "This week" : "Week of " + dayName(w.ws)}</h3><p class="mono">${fmtM(w.info.reduce((s, x) => s + x.cal, 0))} booked · ${fmtM(w.info.reduce((s, x) => s + x.task, 0))} planned</p></div>
    <div class="hz">${w.info.map(x => { const tot = x.cal + x.task; return `<div class="hzc ${x.d === T ? "today" : ""}" title="${dayName(x.d)}: ${fmtM(x.cal)} calendar, ${fmtM(x.task)} tasks"><div class="hzbar ${tot > 660 ? "over" : ""}"><i class="b-tk" style="height:${(x.task / mx) * 100}%"></i><i class="b-cal" style="height:${(x.cal / mx) * 100}%"></i></div><span class="hzl">${new Date(x.d + "T12:00:00").toLocaleDateString(undefined, { weekday: "narrow" })}${new Date(x.d + "T12:00:00").getDate()}</span></div>`; }).join("")}</div>
    ${w.dues.length || w.gs.length || w.allday.length ? `<div class="list" style="margin-top:8px">${w.gs.map(g => `<div class="trow" style="grid-template-columns:76px minmax(0,1fr)"><span class="pill acc">Goal</span><span>${esc(g.title)} <span class="muted mono">${dayName(g.target)}</span></span></div>`).join("")}${w.dues.map(t => `<div class="trow" style="grid-template-columns:76px minmax(0,1fr)"><span class="mono muted" style="font-size:12px">${dayName(t.due)}</span><span class="tt" data-act="edit" data-id="${t.id}">${esc(t.title)} ${areaPill(t)}</span></div>`).join("")}${w.allday.slice(0, 4).map(t => `<div class="trow" style="grid-template-columns:76px minmax(0,1fr)"><span class="mono muted" style="font-size:12px">All day</span><span>${esc(t)}</span></div>`).join("")}</div>` : `<p class="empty-note">Nothing with a deadline this week.</p>`}</section>`).join("")}</div>`;
}

function viewPlan() {
  const chips = `<div class="chips" role="group" aria-label="Filter by area"><button class="chip" aria-pressed="${filter === "all"}" data-act="filter" data-f="all">All</button>${AREAS.map(a => `<button class="chip" aria-pressed="${filter === a.id}" data-act="filter" data-f="${a.id}"><span class="dot" style="--c:var(${a.cv})"></span>${esc(a.name)}</button>`).join("")}</div>`;
  const f = t => filter === "all" || t.area === filter, T = todayISO();
  const o = open().filter(f);
  const inbox = o.filter(t => !t.day).sort((a, b) => score(b) - score(a));
  const sched = o.filter(t => t.day).sort((a, b) => a.day.localeCompare(b.day));
  const days = [...new Set(sched.map(t => t.day))];
  const some = all().filter(t => t.status === "someday" && f(t));
  const recent = all().filter(t => t.status === "done" && f(t)).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 8);
  return `<div class="stack"><div class="sec-head"><h2>Plan</h2><div class="row-actions"><button class="btn" data-act="dump" data-mode="import">Import notes</button><button class="btn" data-act="scanMail">Scan email</button><button class="btn primary" data-act="new">${ico("plus")}New task</button></div></div>${chips}
    <section class="card"><div class="sec-head"><h3>Inbox</h3><p>No day yet. Decide, schedule, or drop.</p></div>${inbox.length ? `<div class="list">${inbox.map(t => row(t, { today: true, tmrw: true })).join("")}</div>` : `<p class="empty-note">Inbox zero for this filter.</p>`}</section>
    ${days.map(d => `<section class="card"><div class="sec-head"><h3>${d === T ? "Today" : d === addDays(T, 1) ? "Tomorrow" : dayName(d)}</h3><p class="mono">${fmtM(sched.filter(t => t.day === d).reduce((s, t) => s + est(t), 0))}</p></div><div class="list">${sched.filter(t => t.day === d).map(t => row(t)).join("")}</div></section>`).join("")}
    ${some.length ? `<section class="card"><div class="sec-head"><h3>Someday</h3><p>Parked on purpose.</p></div><div class="list">${some.map(t => row(t, { today: true })).join("")}</div></section>` : ""}
    ${recent.length ? `<section class="card"><div class="sec-head"><h3>Recently done</h3></div><div class="list">${recent.map(t => row(t)).join("")}</div></section>` : ""}</div>`;
}

function goalStats(id) {
  const ts = all().filter(t => t.goal === id), d = ts.filter(t => t.status === "done").length;
  const nxt = ts.filter(t => t.status === "open").sort((a, b) => (a.day || "9").localeCompare(b.day || "9") || a.created - b.created)[0];
  return { total: ts.length, done: d, next: nxt };
}
function viewGoals() {
  const hz = { quarter: "This quarter", year: "This year", life: "Long-term" };
  const gs = Object.entries(S.goals).map(([id, g]) => ({ id, ...g })).sort((a, b) => ["quarter", "year", "life"].indexOf(a.horizon) - ["quarter", "year", "life"].indexOf(b.horizon));
  return `<div class="stack"><div class="sec-head"><div><h2>Goals</h2><p>Every goal needs a visible next step, or it is only a wish.</p></div><button class="btn primary" data-act="newGoal">${ico("plus")}New goal</button></div>
    ${gs.length ? gs.map(g => { const st = goalStats(g.id), a = AREA[g.area] || AREA.work, P = proposals[g.id];
      return `<article class="card goal" style="--c:var(${a.cv})"><div class="gt"><div style="min-width:0"><div class="eyebrow">${hz[g.horizon] || ""}${g.target ? ` · by ${dayName(g.target)}` : ""}</div><div class="gh">${esc(g.title)}</div>${g.why ? `<p class="muted" style="font-size:14px">${esc(g.why)}</p>` : ""}</div><div class="row-actions"><button class="btn small" data-act="editGoal" data-id="${g.id}">Edit</button></div></div>
      <div class="meta">${areaPill({ area: g.area })}<span class="pill mono">${st.done}/${st.total} steps</span>${g.example ? '<span class="pill">example</span>' : ""}</div>
      ${st.next ? `<div class="next"><span><span class="eyebrow">Next step</span><br>${esc(st.next.title)} <span class="muted mono">${fmtM(est(st.next))}</span></span><span class="row-actions"><button class="btn small" data-act="day" data-id="${st.next.id}" data-d="${todayISO()}">Do today</button></span></div>` : `<div class="alert crit"><span><strong>No next step.</strong> This goal is stalled until you define one.</span></div>`}
      ${P ? (P.loading ? '<p class="muted">Coach is breaking it down…</p>' : P.error ? `<p class="muted">${esc(P.error)}</p>` : `<div class="prop"><div class="eyebrow">Proposed steps${P.cadence ? ` · ${esc(P.cadence)}` : ""}</div>${P.steps.map((s, i) => `<label><input type="checkbox" data-prop="${g.id}" data-i="${i}" checked> <span>${esc(s.title)} <span class="muted mono">${fmtM(s.est)} · ${esc((AREA[s.area] || AREA.work).name)}</span></span></label>`).join("")}<div class="row-actions" style="margin-top:6px"><button class="btn small primary" data-act="addProp" data-id="${g.id}">Add checked to inbox</button><button class="btn small ghost" data-act="dismissProp" data-id="${g.id}">Dismiss</button></div></div>`) : ""}
      <div class="row-actions"><button class="btn small" data-act="breakdown" data-id="${g.id}">Break it down</button><button class="btn small" data-act="askGoal" data-id="${g.id}">Challenge this goal</button></div></article>`; }).join("") : `<div class="card"><p class="empty-note">No goals yet. Add the long-term thing you keep circling, then break it down into steps small enough to schedule.</p></div>`}</div>`;
}

/* ---------- coach ---------- */
function viewCoach(view) {
  view.innerHTML = `<div class="chat"><div><div class="chips" id="modes">${[["Plan my day", "Plan my day. Look at everything on my plate, challenge it against my values, and help me land a Big 3 plus one thing for me. Ask me one sharp question first."], ["Plan my week", "Plan my week with me. Check the balance across work and the rest of my life, my goals, and what I keep postponing. Start with one question."], ["Monthly reset", "Run a monthly reset. Review my goals and last weeks' patterns, ask what to stop, start and protect, then save a one-line monthly focus."], ["I'm avoiding something", "I'm avoiding something. Help me figure out what it is, what I'm afraid will happen, and the smallest brave move."], ["Work the backlog", "Let's work the backlog. Look at my inbox and unscheduled tasks, tell me what to drop, what to schedule this week, and what is really a goal in disguise. One question first."], ["Close my day", "Close my day with me. Ask how it went against my Big 3, what I avoided, and what tomorrow should protect."]].map(([l, q]) => `<button class="chip" data-act="ask" data-q="${esc(q)}" data-label="${esc(l)}">${esc(l)}</button>`).join("")}</div></div>
    <div class="log card" id="log" role="log" aria-live="polite"></div>
    <form class="compose" id="chatform"><textarea id="chatin" rows="1" placeholder="Tell the coach what's on your mind. It will push back." aria-label="Message the coach"></textarea><button class="btn primary" type="submit" id="chatsend">Send</button></form></div>`;
  paintLog();
}
function paintLog() {
  const el = $("#log"); if (!el) return;
  const ms = [...S.coach];
  if (busy && draft) ms.push({ role: "assistant", content: draft });
  else if (busy) ms.push({ role: "assistant", content: "Thinking…" });
  el.innerHTML = ms.length ? ms.map(m => `<div class="msg ${m.role}">${esc(m.label || m.content)}${m.actions && m.actions.length ? `<div class="acts-log">${m.actions.map(a => `<span class="pill good">${esc(a)}</span>`).join("")}</div>` : ""}</div>`).join("")
    : `<div class="empty-note">Pick a check-in above, or just start talking. The coach sees your tasks, goals, balance and what you keep moving, and it will ask why before it says yes.</div>`;
  el.scrollTop = el.scrollHeight;
  const b = $("#chatsend"); if (b) b.disabled = busy;
}
function snapshotText() {
  const T = todayISO(), ws = weekStart(), line = t => `[${t.id}] ${t.title} | ${(AREA[t.area] || AREA.build).name}, ${est(t)}m${t.day ? ", " + t.day : ""}${t.focus ? ", BIG3" : ""}${t.hard ? ", hard conversation" : ""}${t.deferCount ? `, moved ${t.deferCount}x` : ""}${t.due ? ", due " + t.due : ""}${t.goal && S.goals[t.goal] ? ", goal: " + S.goals[t.goal].title : ""}${t.why ? ", why: " + t.why : ""}${t.moves && t.moves.length ? ", last move reason: " + (t.moves[t.moves.length - 1].reason || "none") : ""}`;
  const o = open(), wk = weekMinutes(), L = dayLoad(T), day = S.days[T] || {};
  const days = Object.entries(S.days).sort().slice(-7).map(([d, v]) => `${d}: went well=${v.win || "-"}; grateful=${v.grat || "-"}`);
  const cal = [...Array(7)].map((_, i) => addDays(T, i)).map(d => { const es = eventsOn(d).filter(e => !/birthday/i.test(e.title)); return es.length ? `${d}: ${es.map(e => e.allDay ? `all day ${e.title}` : `${fmtT(e.s)}-${fmtT(e.en)} ${e.title}`).join("; ")}` : ""; }).filter(Boolean);
  const habits = Object.entries(S.habits).map(([id, h]) => `${h.title}: ${(day.h || {})[id] || 0}/${h.target} ${h.unit || ""} today`);
  return [`TODAY: ${T} (${new Date().toLocaleDateString(undefined, { weekday: "long" })}). Task capacity ${fmtM(S.settings.capacity)} (Wes set this high on purpose; treat it as optimistic), planned today ${fmtM(L.done + L.plan)} (${fmtM(L.done)} done). Calendar booked today ${fmtM(calBusy(T))}.`,
    `CALENDAR, NEXT 7 DAYS (${CAL.status === "ok" ? "synced" : "not synced"}):\n${cal.join("\n") || "(nothing or not synced)"}`,
    `WEEK INTENTION: ${(S.plans["w-" + ws] || {}).text || "(none)"}  MONTH FOCUS: ${(S.plans["m-" + T.slice(0, 7)] || {}).text || "(none)"}  MIND DUMPED TODAY: ${day.dumped ? "yes" : "no"}`,
    `TODAY'S TASKS:\n${o.filter(t => t.day === T).map(line).join("\n") || "(none)"}`,
    `INBOX / UNSCHEDULED (top 25 by score):\n${o.filter(t => !t.day).sort((a, b) => score(b) - score(a)).slice(0, 25).map(line).join("\n") || "(empty)"}`,
    `LATER THIS WEEK AND BEYOND:\n${o.filter(t => t.day && t.day > T).slice(0, 15).map(line).join("\n") || "(none)"}`,
    `DEADLINES COMING (next 30 days):\n${o.filter(t => t.due && t.due <= addDays(T, 30)).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 15).map(line).join("\n") || "(none)"}`,
    `WEEK BALANCE (done+planned vs weekly target): ${AREAS.map(a => `${a.name} ${fmtM(wk[a.id].done + wk[a.id].plan)}${S.settings.targets[a.id] ? "/" + fmtM(S.settings.targets[a.id]) : ""}`).join("; ")}`,
    `DAILY GOALS: ${habits.join("; ") || "(none)"}`,
    `GOALS:\n${Object.entries(S.goals).map(([id, g]) => { const s = goalStats(id); return `(${id}) ${g.title} [${g.horizon}, ${(AREA[g.area] || AREA.build).name}] ${s.done}/${s.total} steps, next step: ${s.next ? s.next.title : "NONE"}${g.why ? ", why: " + g.why : ""}`; }).join("\n") || "(none)"}`,
    `RECENT REFLECTIONS:\n${days.join("\n") || "(none)"}`].join("\n\n");
}
function systemText() {
  return `You are the planning coach inside Wes White's personal task manager. Wes is a psychotherapist in Chicago (about 70% couples) who is building his private practice and a content business (daily TikTok, weekly YouTube) with a long-term goal of replacing his income with digital products and becoming a speaker, author and trainer. He expects to build toward about five face-to-face client sessions a day. ${S.settings.profile || ""}
Areas: ${AREA_HELP}.
Wes's values: ${S.settings.values.join(", ")}. He wants to be braver in conflict, more decisive, more present, and to protect joy, friends, body and space (creativity, silence, slowing down) from being swallowed by work. Treat protecting space as part of the job: when a day or week is packed, push back on that too, and ask what he is afraid will happen if he leaves room.
How to coach: be direct, warm and brief (under 150 words unless asked). Ask ONE sharp question at a time. Push at a moderate level: challenge motives (why this, why now, what is the cost of skipping, what are you afraid could happen), name avoidance without lecturing, but ALWAYS respect an override. If Wes gives a logistical, timing or relevance reason to do something else, accept it and help him re-plan; do not re-litigate. Treat him as an expert; no moral lectures. Offer concrete options and recommend one. Do not cite research unless you can name the primary source, and say when something is clinical consensus rather than evidence. Use tools to act only after Wes agrees: add_task, schedule_task (day plus optional Big 3), set_plan (week or month focus). Never invent task ids.`;
}
async function ask(q, label) {
  if (busy) return;
  tab = "coach"; render();
  S.coach.push({ role: "user", content: q, label: label || undefined });
  paintLog(); await runCoach();
}
async function runCoach() {
  busy = true; draft = ""; paintLog();
  const actions = [];
  try {
    SAMPLE = SAMPLE || (window.claude && window.claude.use ? await window.claude.use("sample") : null);
    if (!SAMPLE) throw { code: "none" };
    const hist = S.coach.slice(-16).map(m => ({ role: m.role, content: m.content }));
    while (hist.length && hist[0].role !== "user") hist.shift();
    hist[0] = { role: "user", content: `${systemText()}\n\nCURRENT STATE\n${snapshotText()}\n\n---\nConversation so far begins here.\n\n${hist[0].content}` };
    ctl = new AbortController();
    const tools = [
      { name: "add_task", description: "Add a task to Wes's inbox or a day.", inputSchema: { type: "object", properties: { title: { type: "string" }, area: { type: "string", enum: AREAS.map(a => a.id) }, est_minutes: { type: "number" }, day: { type: "string", description: "YYYY-MM-DD or empty for inbox" }, why: { type: "string" } }, required: ["title", "area"] }, execute: i => { addTask({ title: String(i.title).slice(0, 200), area: AREA[i.area] ? i.area : "work", est: i.est_minutes || 30, day: /^\d{4}-\d\d-\d\d$/.test(i.day || "") ? i.day : "", why: i.why || "" }); actions.push("Added: " + i.title); return "added"; } },
      { name: "schedule_task", description: "Move an existing open task to a day, optionally as a Big 3 for that day.", inputSchema: { type: "object", properties: { task_id: { type: "string" }, day: { type: "string" }, big3: { type: "boolean" } }, required: ["task_id", "day"] }, execute: i => { const t = S.tasks[i.task_id]; if (!t) return "unknown task id"; if (!/^\d{4}-\d\d-\d\d$/.test(i.day)) return "bad date"; store.patch("tasks", i.task_id, { day: i.day, focus: !!i.big3 }); actions.push(`Scheduled: ${t.title} → ${dayName(i.day)}${i.big3 ? " (Big 3)" : ""}`); return "scheduled"; } },
      { name: "set_plan", description: "Save Wes's focus for the week or month.", inputSchema: { type: "object", properties: { period: { type: "string", enum: ["week", "month"] }, text: { type: "string" } }, required: ["period", "text"] }, execute: i => { const key = i.period === "month" ? "m-" + todayISO().slice(0, 7) : "w-" + weekStart(); store.set("plans", key, { text: String(i.text).slice(0, 300), at: Date.now() }); actions.push(`Saved ${i.period} focus`); return "saved"; } }
    ];
    const res = await SAMPLE(hist, { cache: false, signal: ctl.signal, tools, onText: ({ text }) => { draft = text; paintLog(); } });
    S.coach.push({ role: "assistant", content: res.text || draft || "(no reply)", actions });
  } catch (e) {
    S.coach.push({ role: "assistant", content: e && e.code === "not_granted" ? "Coach access was declined for this page. You can allow it from the page's permissions menu." : e && e.code === "none" ? "The coach isn't available in this view. Open the artifact in claude.ai to chat." : e && e.code === "rate_limited" ? "Rate limited. Give it a minute." : "Something went wrong reaching the coach. Try again.", actions });
  }
  busy = false; draft = ""; S.coach = S.coach.slice(-40);
  if (DB) DB.doc("coach/log").set(clean({ messages: S.coach })).catch(() => {}); else lsSave();
  paintLog();
}
async function breakdown(id) {
  const g = S.goals[id]; if (!g) return;
  proposals[id] = { loading: true }; render();
  try {
    SAMPLE = SAMPLE || await window.claude.use("sample");
    const r = await SAMPLE.json(`${systemText()}\n\nBreak this goal into steps Wes can actually schedule. Goal: "${g.title}" (${g.horizon}, area ${g.area}). Why it matters: ${g.why || "unknown"}. Target date: ${g.target || "none"}.\nCurrent week balance and tasks for context:\n${snapshotText()}\n\nReturn ONLY JSON: {"cadence": "short suggestion like '30 min, 3x/week'", "steps": [{"title": "verb-first, doable in one sitting", "area": one of ${AREAS.map(a => a.id).join("|")}, "est_minutes": number up to 90}]}. 5 to 8 steps, ordered, the first one doable in under 25 minutes.`, { cache: false });
    proposals[id] = { cadence: r.cadence, steps: (r.steps || []).slice(0, 10).map(s => ({ title: String(s.title), area: AREA[s.area] ? s.area : g.area, est: s.est_minutes || 30 })) };
  } catch (e) { proposals[id] = { error: e && e.code === "not_granted" ? "Coach access was declined for this page." : "Could not reach the coach. Try again." }; }
  render();
}

/* ---------- overlays ---------- */
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
function closeLayer() { clearInterval(focusTimer); $("#layer").innerHTML = ""; }
function sheet(html, cls) { $("#layer").innerHTML = `<div class="overlay" data-act="bg"><div class="sheet ${cls || ""}" role="dialog" aria-modal="true">${html}</div></div>`; const f = $("#layer input[type=text], #layer textarea"); if (f) f.focus(); }

  <div class="two"><div class="field"><label for="f-area">Area</label><select id="f-area">${opts(AREAS.map(a => [a.id, a.name]), t.area)}</select></div>
  <div class="field"><label for="f-est">Time</label><select id="f-est">${opts([10, 15, 30, 45, 60, 90, 120, 180].map(m => [m, fmtM(m)]), String(est(t)))}</select></div></div>
  <div class="two"><div class="field"><label for="f-day">Day</label><input type="date" id="f-day" value="${esc(t.day || "")}"></div><div class="field"><label for="f-due">Due (optional)</label><input type="date" id="f-due" value="${esc(t.due || "")}"></div></div>
  <div class="row-actions"><button class="btn small" data-act="setfday" data-d="${todayISO()}">Today</button><button class="btn small" data-act="setfday" data-d="${addDays(todayISO(), 1)}">Tomorrow</button><button class="btn small" data-act="setfday" data-d="">No day</button></div>
  <div class="two"><div class="field"><label for="f-goal">Goal</label><select id="f-goal">${opts([["", "None"], ...Object.entries(S.goals).map(([k, g]) => [k, g.title])], t.goal || "")}</select></div>
  <div class="field"><label for="f-value">Value it serves</label><select id="f-value">${opts([["", "None"], ...S.settings.values.map(v => [v, v])], t.value || "")}</select></div></div>
  <div class="field"><label for="f-why">Why does this matter? (the coach will ask)</label><textarea id="f-why">${esc(t.why || "")}</textarea></div>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f-hard" ${t.hard ? "checked" : ""}> A hard conversation or something I'm tempted to avoid</label>
  <div class="row-actions" style="justify-content:space-between"><span class="row-actions"><button class="btn primary" data-act="saveTask" data-id="${id || ""}">Save</button><button class="btn" data-act="close">Cancel</button></span><span class="row-actions">${id ? `<button class="btn" data-act="askTask" data-id="${id}">Ask coach</button><button class="btn" data-act="someday" data-id="${id}">Someday</button><button class="btn danger" data-act="delTask" data-id="${id}">Delete</button>` : ""}</span></div>`);
}
function editGoal(id) {
  const g = id ? S.goals[id] : { title: "", area: "build", horizon: "quarter", why: "", target: "" };
  sheet(`<h2>${id ? "Edit goal" : "New goal"}</h2>
  <div class="field"><label for="g-title">Goal</label><input type="text" id="g-title" value="${esc(g.title)}" placeholder="Launch my first digital product"></div>
  <div class="two"><div class="field"><label for="g-area">Area</label><select id="g-area">${opts(AREAS.map(a => [a.id, a.name]), g.area)}</select></div>
  <div class="field"><label for="g-hz">Horizon</label><select id="g-hz">${opts([["quarter", "This quarter"], ["year", "This year"], ["life", "Long-term"]], g.horizon)}</select></div></div>
  <div class="field"><label for="g-target">Target date (optional)</label><input type="date" id="g-target" value="${esc(g.target || "")}"></div>
  <div class="field"><label for="g-why">Why does this matter to you?</label><textarea id="g-why">${esc(g.why || "")}</textarea></div>
  <div class="row-actions"><button class="btn primary" data-act="saveGoal" data-id="${id || ""}">Save</button><button class="btn" data-act="close">Cancel</button>${id ? `<button class="btn danger" data-act="delGoal" data-id="${id}">Delete</button>` : ""}</div>`);
}
function settingsSheet() {
  const s = S.settings;
  sheet(`<h2>Settings</h2>
  <div class="field"><label for="s-cap">Task hours per day (high on purpose; the coach will test it)</label><input type="number" id="s-cap" min="1" max="14" step="0.5" value="${s.capacity / 60}"></div>
  <div class="eyebrow">Weekly hours to protect</div>
  <div class="two">${NOURISH.map(a => `<div class="field"><label for="s-${a}">${esc(AREA[a].name)}</label><input type="number" id="s-${a}" min="0" max="40" step="0.5" value="${(s.targets[a] || 0) / 60}"></div>`).join("")}</div>
  <div class="field"><label>Calendars to read</label><div class="prop" id="callist"><span class="muted">Loading your calendars…</span></div><p class="muted" style="font-size:12px">With none checked, only your primary calendar is read.</p></div>
  <div class="field"><label for="s-values">Values (comma separated)</label><input type="text" id="s-values" value="${esc(s.values.join(", "))}"></div>
  <div class="field"><label for="s-profile">Anything else the coach should know about you</label><textarea id="s-profile" rows="5">${esc(s.profile || "")}</textarea></div>
  <div class="row-actions"><button class="btn primary" data-act="saveSettings">Save</button><button class="btn" data-act="close">Cancel</button>${all().some(t => t.example) || Object.values(S.goals).some(g => g.example) ? '<button class="btn danger" data-act="clearEx">Clear example data</button>' : ""}</div>`, "wide");
  loadCalList();
}
async function loadCalList() {
  const el = $("#callist"); if (!el) return;
  const m = await mcp(); if (!m) { el.innerHTML = '<span class="muted">Open this page in claude.ai to choose calendars.</span>'; return; }
  try {
    const p = unwrap(await m.callTool("Google Calendar", "list_calendars", {})), cs = (p && p.calendars) || [];
    const sel = new Set(S.settings.calendars || []);
    el.innerHTML = cs.map(c => `<label><input type="checkbox" data-cal="${esc(c.id)}" ${sel.has(c.id) ? "checked" : ""}> <span>${esc(c.summary || c.id)}</span></label>`).join("") || '<span class="muted">No calendars found.</span>';
    el.dataset.loaded = "1";
  } catch (e) { el.innerHTML = '<span class="muted">Could not load calendars.</span>'; }
}
function habitsSheet() {
  sheet(`<h2>Daily goals</h2><p class="muted">Small daily targets that add up, like 300 push-ups in sets of 50. Minutes per day count toward that area's weekly time when you hit the target.</p>
  ${Object.entries(S.habits).map(([id, h]) => `<div class="trow" style="grid-template-columns:minmax(0,1fr) auto"><div>${esc(h.title)}<br><span class="muted mono" style="font-size:12px">${h.target} ${esc(h.unit || "")} a day · +${h.step || 1} per tap · ${fmtM(h.mins || 0)} · ${esc((AREA[h.area] || AREA.self).name)}</span></div><button class="btn small danger" data-act="delHabit" data-id="${id}">Remove</button></div>`).join("") || '<p class="empty-note">None yet.</p>'}
  <div class="eyebrow">Add one</div>
  <div class="field"><label for="h-title">Goal</label><input type="text" id="h-title" placeholder="Push-ups"></div>
  <div class="two"><div class="field"><label for="h-target">Daily target</label><input type="number" id="h-target" min="1" value="300"></div><div class="field"><label for="h-unit">Unit</label><input type="text" id="h-unit" value="reps"></div></div>
  <div class="two"><div class="field"><label for="h-step">Per tap</label><input type="number" id="h-step" min="1" value="50"></div><div class="field"><label for="h-mins">Minutes a day, in total</label><input type="number" id="h-mins" min="0" value="15"></div></div>
  <div class="field"><label for="h-area">Counts toward</label><select id="h-area">${opts(AREAS.map(a => [a.id, a.name]), "self")}</select></div>
  <div class="row-actions"><button class="btn primary" data-act="saveHabit">Add goal</button><button class="btn" data-act="close">Close</button></div>`);
}
function startFocus(id) {
  const t = S.tasks[id]; if (!t) return;
  let end = Date.now() + 25 * 60000;
  const paint = () => { const r = Math.max(0, end - Date.now()); const el = $("#tm"); if (el) el.textContent = `${pad(Math.floor(r / 60000))}:${pad(Math.floor(r / 1000) % 60)}`; if (!r) { clearInterval(focusTimer); const n = $("#tmnote"); if (n) n.textContent = "Time. Done, or another round?"; } };
  sheet(`<div class="eyebrow" style="text-align:center">One thing. Nothing else.</div><div class="focus" style="display:grid"><div class="big">${esc(t.title)}</div>${t.why ? `<p class="muted"><em>${esc(t.why)}</em></p>` : ""}<div class="timer" id="tm">25:00</div><p class="muted" id="tmnote">Phone away. Just begin.</p>
  <div class="row-actions" style="justify-content:center"><button class="btn primary" data-act="done" data-id="${id}" data-close="1">${ico("check")}Done</button><button class="btn" data-act="more">+10 min</button><button class="btn" data-act="askTask" data-id="${id}">I'm stuck</button><button class="btn ghost" data-act="close">Not now</button></div></div>`);
  focusTimer = setInterval(paint, 500); focusTimer && (window.__extend = () => { end += 10 * 60000; });
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === "bg") { if (e.target === el) closeLayer(); return; }
  if (a === "tab") { tab = el.dataset.k; $("#view").innerHTML = ""; render(); }
  else if (a === "filter") { filter = el.dataset.f; render(); }
  else if (a === "done") { complete(id); if (el.dataset.close) closeLayer(); }
  else if (a === "big") toggleBig(id);
  else if (a === "defer") moveTask(id, addDays(todayISO(), 1));
  else if (a === "day") moveTask(id, el.dataset.d);
  else if (a === "edit") editTask(id);
  else if (a === "new") editTask(null);
  else if (a === "focus") startFocus(id);
  else if (a === "more") { if (window.__extend) window.__extend(); }
  else if (a === "close") closeLayer();
  else if (a === "someday") { store.patch("tasks", id, { status: "someday", day: "", focus: false }); closeLayer(); toast("Parked as someday."); }
  else if (a === "delTask") { store.del("tasks", id); closeLayer(); }
  else if (a === "setfday") { $("#f-day").value = el.dataset.d; }
  else if (a === "saveTask") {
    const title = $("#f-title").value.trim(); if (!title) return toast("Give it a title.");
    const p = { title, area: $("#f-area").value, est: Number($("#f-est").value), day: $("#f-day").value, due: $("#f-due").value, goal: $("#f-goal").value, value: $("#f-value").value, why: $("#f-why").value.trim(), hard: $("#f-hard").checked };
    if (id) store.patch("tasks", id, p); else addTask(p);
    closeLayer();
  }
  else if (a === "newGoal") editGoal(null);
  else if (a === "editGoal") editGoal(id);
  else if (a === "delGoal") { Object.entries(S.tasks).forEach(([k, t]) => { if (t.goal === id) store.patch("tasks", k, { goal: "" }); }); store.del("goals", id); closeLayer(); }
  else if (a === "saveGoal") {
    const title = $("#g-title").value.trim(); if (!title) return toast("Name the goal.");
    const g = { ...(id ? S.goals[id] : {}), title, area: $("#g-area").value, horizon: $("#g-hz").value, target: $("#g-target").value, why: $("#g-why").value.trim() };
    store.set("goals", id || rid(), g); closeLayer();
  }
  else if (a === "breakdown") breakdown(id);
  else if (a === "dismissProp") { delete proposals[id]; render(); }
  else if (a === "addProp") {
    const g = S.goals[id], P = proposals[id]; let n = 0;
    document.querySelectorAll(`[data-prop="${id}"]`).forEach(c => { if (c.checked) { const s = P.steps[Number(c.dataset.i)]; addTask({ title: s.title, area: s.area, est: s.est, goal: id }); n++; } });
    delete proposals[id]; toast(`${n} steps added to the inbox.`); render();
  }
  else if (a === "askGoal") { const g = S.goals[id]; ask(`Challenge my goal "${g.title}". Is it the right goal, why does it matter to me, what am I not saying, and what would the first 30 days look like?`, `Challenge: ${g.title}`); }
  else if (a === "askTask") { const t = S.tasks[id]; closeLayer(); ask(`Help me think through this task: [${id}] ${t.title}. Challenge me: why does it matter, what is the smallest next step, and should it be on my plate at all?`, `About: ${t.title}`); }
  else if (a === "ask") ask(el.dataset.q, el.dataset.label);
  else if (a === "settings") settingsSheet();
  else if (a === "brief") makeBrief();
  else if (a === "dump") dumpSheet(el.dataset.mode);
  else if (a === "sortDump") sortDump(el.dataset.mode);
  else if (a === "scanMail") scanMail();
  else if (a === "syncCal") syncCal();
  else if (a === "habit") bumpHabit(id, Number(el.dataset.n) || 1);
  else if (a === "habits") habitsSheet();
  else if (a === "delHabit") { store.del("habits", id); habitsSheet(); }
  else if (a === "saveHabit") {
    const title = $("#h-title").value.trim(); if (!title) return toast("Name the goal.");
    store.set("habits", rid(), { title, target: Number($("#h-target").value) || 1, unit: $("#h-unit").value.trim(), step: Number($("#h-step").value) || 1, mins: Number($("#h-mins").value) || 0, area: $("#h-area").value });
    habitsSheet();
  }
  else if (a === "addRev") {
    let n = 0;
    document.querySelectorAll("[data-rev]").forEach(c => { if (c.checked) { const t = REV.items[Number(c.dataset.rev)]; addTask({ title: t.title, area: t.area, est: t.est, hard: t.hard, due: t.due, goal: t.goal, why: t.why }); n++; } });
    closeLayer(); toast(`${n} ${n === 1 ? "task" : "tasks"} added to the inbox.`);
  }
  else if (a === "gateReason") { gateReason = el.dataset.r; document.querySelectorAll("#reasons .chip").forEach(c => c.setAttribute("aria-pressed", String(c === el))); }
  else if (a === "gateMove") {
    const t = S.tasks[id], fear = ($("#gf") || {}).value || "", r = gateReason;
    setDay(id, el.dataset.d, !!r && r !== "I'm avoiding it");
    store.patch("tasks", id, { moves: [...(t.moves || []), { at: Date.now(), reason: r, fear: fear.trim(), to: el.dataset.d }].slice(-8) });
    closeLayer(); toast("Moved. Your call.");
  }
  else if (a === "saveSettings") {
    const num = k => Math.max(0, Number($("#s-" + k).value) || 0) * 60, cl = $("#callist");
    const cals = cl && cl.dataset.loaded ? [...cl.querySelectorAll("[data-cal]")].filter(c => c.checked).map(c => c.dataset.cal) : (S.settings.calendars || []);
    store.set("settings", "main", { ...S.settings, capacity: num("cap") || 390, targets: Object.fromEntries(NOURISH.map(k => [k, num(k)])), values: $("#s-values").value.split(",").map(v => v.trim()).filter(Boolean), profile: $("#s-profile").value.trim(), calendars: cals });
    closeLayer(); toast("Saved."); syncCal();
  }
  else if (a === "clearEx") {
    Object.entries(S.tasks).forEach(([k, t]) => { if (t.example) store.del("tasks", k); });
    Object.entries(S.goals).forEach(([k, g]) => { if (g.example) store.del("goals", k); });
    closeLayer(); toast("Examples cleared.");
  }
});
document.addEventListener("change", e => {
  const el = e.target, k = el.dataset.save; if (!k) return;
  if (k === "week") store.set("plans", "w-" + weekStart(), { text: el.value.trim(), at: Date.now() });
  if (k === "day") store.set("days", todayISO(), { ...(S.days[todayISO()] || {}), [el.dataset.f]: el.value.trim() });

  e.preventDefault();
  const v = $("#cap").value.trim(); if (!v) return;

document.addEventListener("submit", e => {

document.addEventListener("keydown", e => {
